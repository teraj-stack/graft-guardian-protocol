name: Visual Logo Check

on:
  # Always run on every pull request (any branch, any path)
  pull_request:
    branches: ['**']

  # On push, only run when relevant sections / assets / test infra change.
  # PBM, HBOT and LADD sections live in src/routes/index.tsx and the product
  # pages; brand logos live in src/assets; the check itself is in scripts/.
  push:
    branches: ['**']
    paths:
      - 'src/routes/index.tsx'
      - 'src/routes/sklep.tsx'
      - 'src/routes/product.$handle.tsx'
      - 'src/assets/graftgen-logo*'
      - 'src/assets/msc-logo*'
      - 'scripts/visual-logo-check.py'
      - 'scripts/visual-diff.py'
      - 'tests/visual-baselines/**'
      - '.github/workflows/visual-logo-check.yml'
      - 'package.json'
      - 'bun.lockb'

  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  visual-logo-check:
    name: Verify Graftgen / MSC logos (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install playwright==1.48.0 Pillow==10.4.0

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "preview up"; exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"; tail -n 200 preview.log; exit 1

      - name: Run visual logo check
        id: logo_check
        env:
          BASE_URL: http://127.0.0.1:8080
          VISUAL_OUT: visual-report
        # Continue on failure so the diff step still runs and the artifact
        # uploads heatmaps/overlays for inspection on the PR.
        continue-on-error: true
        run: python scripts/visual-logo-check.py

      - name: Generate visual diff (heatmap + overlay)
        if: always()
        env:
          VISUAL_OUT: visual-report
          VISUAL_BASELINES: tests/visual-baselines
          VISUAL_DIFF_THRESHOLD: '1.0'
        # Exit 2 = no baselines yet (soft pass). Anything else propagates.
        run: |
          set +e
          python scripts/visual-diff.py
          code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::No visual baselines committed yet. Seed them with: python scripts/visual-diff.py --update-baselines"
            exit 0
          fi
          exit $code

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" 2>/dev/null || true; fi

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-logo-report
          path: visual-report

      - name: Fail job if logo assertions failed
        if: steps.logo_check.outcome == 'failure'
        run: |
          echo "Visual logo assertions failed — see visual-logo-report artifact (diff/index.html)."
          exit 1
