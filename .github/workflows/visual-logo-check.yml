name: Visual Logo Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  visual-logo-check:
    name: Verify Graftgen / MSC logos (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install playwright==1.48.0

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "preview up"; exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"; tail -n 200 preview.log; exit 1

      - name: Run visual logo check
        env:
          BASE_URL: http://127.0.0.1:8080
          VISUAL_OUT: visual-report
        run: python scripts/visual-logo-check.py

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" 2>/dev/null || true; fi

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-logo-report
          path: visual-report
