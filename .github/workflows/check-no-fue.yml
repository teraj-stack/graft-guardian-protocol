name: Check FUE Terminology

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check-no-fue:
    name: Verify no FUE references (post-DHI migration)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run FUE guard
        id: guard
        run: |
          set +e
          node scripts/check-no-fue.mjs --json > fue-report.json
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload FUE report artifact
        id: upload
        if: steps.guard.outputs.exitcode != '0'
        uses: actions/upload-artifact@v4
        with:
          name: fue-report
          path: fue-report.json

      - name: Comment PR with FUE findings
        if: github.event_name == 'pull_request' && steps.guard.outputs.exitcode != '0'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('fue-report.json', 'utf8'));
            } catch (e) {
              report = { ok: false, hits: [] };
            }

            const branch = context.payload.pull_request.head.ref;
            const baseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${branch}`;
            const enc = (p) => p.split('/').map(encodeURIComponent).join('/');

            const byFile = {};
            for (const h of report.hits) {
              (byFile[h.file] ||= []).push(h);
            }
            const files = Object.keys(byFile).sort();
            const totalFiles = files.length;
            const totalHits = report.hits.length;

            let detailsBlocks = '';
            for (const file of files) {
              const hits = byFile[file];
              const lines = hits.map(h => {
                const url = `${baseUrl}/${enc(file)}#L${h.line}`;
                return `- [L${h.line}](${url}) — \`${h.text.replace(/`/g, '\\`')}\``;
              }).join('\n');
              detailsBlocks += `<details>\n<summary><strong>📄 ${file}</strong> — ${hits.length} ${hits.length === 1 ? 'wystąpienie' : 'wystąpienia'}</summary>\n\n${lines}\n\n</details>\n\n`;
            }

            const perFileSummary = files.map(file => {
              const hits = byFile[file];
              const first = hits[0];
              const url = `${baseUrl}/${enc(file)}#L${first.line}`;
              return `| [${file}](${url}) | ${hits.length} |`;
            }).join('\n');

            const artifactUrl = process.env.ARTIFACT_URL || '';
            const artifactLink = artifactUrl
              ? `\n\n📥 [Pobierz pełny raport JSON](${artifactUrl})`
              : '';
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const runLink = `\n\n🔗 [Zobacz logi i artefakty tego sprawdzania (run #${context.runId})](${runUrl})`;

            const body = `## 🔍 FUE Terminology Check — wykryto niedozwolone wystąpienia\n\n**Podsumowanie:** znaleziono **${totalHits}** ${totalHits === 1 ? 'wystąpienie' : 'wystąpień'} \`FUE\` w **${totalFiles}** ${totalFiles === 1 ? 'pliku' : 'plikach'}. Po migracji na DHI wszystkie odniesienia powinny używać nowej terminologii.${artifactLink}${runLink}\n\n### Liczba wykryć per plik\n\n| Plik | Wykrycia |\n|------|----------|\n${perFileSummary}\n\n### Szczegóły per plik:\n\n${detailsBlocks}\n> Aby zignorować plik, dopisz go do \`ALLOWLIST\` w \`scripts/check-no-fue.mjs\`.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail on FUE findings
        if: steps.guard.outputs.exitcode != '0'
        run: |
          cat fue-report.json
          exit 1
