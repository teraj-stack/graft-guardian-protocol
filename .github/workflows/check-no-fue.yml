name: Check FUE Terminology

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check-no-fue:
    name: Verify no FUE references (post-DHI migration)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run FUE guard
        id: guard
        run: |
          set +e
          node scripts/check-no-fue.mjs --json > fue-report.json
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload FUE report artifact
        id: upload
        if: steps.guard.outputs.exitcode != '0'
        uses: actions/upload-artifact@v4
        with:
          name: fue-report
          path: fue-report.json

      - name: Comment PR with FUE findings
        if: github.event_name == 'pull_request' && steps.guard.outputs.exitcode != '0'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('fue-report.json', 'utf8'));
            } catch (e) {
              report = { ok: false, hits: [] };
            }

            const branch = context.payload.pull_request.head.ref;
            const baseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${branch}`;
            const enc = (p) => p.split('/').map(encodeURIComponent).join('/');

            const byFile = {};
            for (const h of report.hits) {
              (byFile[h.file] ||= []).push(h);
            }
            const files = Object.keys(byFile).sort();
            const totalFiles = files.length;
            const totalHits = report.hits.length;

            let detailsBlocks = '';
            for (const file of files) {
              const hits = byFile[file];
              const lines = hits.map(h => {
                const url = `${baseUrl}/${enc(file)}#L${h.line}`;
                return `- [L${h.line}](${url}) — \`${h.text.replace(/`/g, '\\`')}\``;
              }).join('\n');
              detailsBlocks += `<details>\n<summary><strong>📄 ${file}</strong> — ${hits.length} ${hits.length === 1 ? 'wystąpienie' : 'wystąpienia'}</summary>\n\n${lines}\n\n</details>\n\n`;
            }

            const perFileSummary = files.map(file => {
              const hits = byFile[file];
              const first = hits[0];
              const url = `${baseUrl}/${enc(file)}#L${first.line}`;
              return `| [${file}](${url}) | ${hits.length} |`;
            }).join('\n');

            const artifactUrl = process.env.ARTIFACT_URL || '';
            const artifactLink = artifactUrl
              ? `\n\n📥 [Pobierz pełny raport JSON](${artifactUrl})`
              : '';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const runLink = `\n\n🔗 [Przejdź do przebiegu workflow #${context.runId} — logi i artefakty](${runUrl})`;

            const marker = '<!-- fue-terminology-check-comment -->';
            const stateRe = /<!-- fue-state: (.+?) -->/;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            let prev = null;
            if (existing) {
              const m = existing.body.match(stateRe);
              if (m) { try { prev = JSON.parse(Buffer.from(m[1], 'base64').toString('utf8')); } catch {} }
            }

            const currentPerFile = Object.fromEntries(files.map(f => [f, byFile[f].length]));
            const fmtDelta = (cur, old) => {
              const d = cur - (old ?? 0);
              if (d > 0) return `🔺 +${d}`;
              if (d < 0) return `🔻 ${d}`;
              return `➖ 0`;
            };

            const history = Array.isArray(prev?.history) ? prev.history.slice(-19) : [];
            history.push({ runId: context.runId, totalHits, totalFiles });

            const sparkline = (values) => {
              const blocks = ['▁','▂','▃','▄','▅','▆','▇','█'];
              const max = Math.max(...values, 1);
              const min = Math.min(...values, 0);
              const span = max - min || 1;
              return values.map(v => blocks[Math.round(((v - min) / span) * (blocks.length - 1))]).join('');
            };
            const quickChart = (label, values, color) => {
              const cfg = {
                type: 'sparkline',
                data: { datasets: [{ data: values, borderColor: color, backgroundColor: color + '33', fill: true }] },
                options: { plugins: { title: { display: true, text: label } } },
              };
              return `https://quickchart.io/chart?w=320&h=90&bkg=white&c=${encodeURIComponent(JSON.stringify(cfg))}`;
            };

            const hitsSeries = history.map(h => h.totalHits);
            const filesSeries = history.map(h => h.totalFiles);
            const labels = history.map(h => `#${h.runId}`).join(' · ');

            const deltaBar = (label, prevVal, currVal, color) => {
              const cfg = {
                type: 'bar',
                data: {
                  labels: ['Poprzedni', 'Bieżący'],
                  datasets: [{ data: [prevVal, currVal], backgroundColor: [color + '88', color], borderColor: color, borderWidth: 1 }]
                },
                options: {
                  plugins: { title: { display: true, text: label }, legend: { display: false } },
                  scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
              };
              return `https://quickchart.io/chart?w=320&h=180&bkg=white&c=${encodeURIComponent(JSON.stringify(cfg))}`;
            };

            const textDeltaSummary = (prevVal, currVal, label) => {
              const d = currVal - prevVal;
              const arrow = d > 0 ? '⬆️' : d < 0 ? '⬇️' : '➡️';
              const sign = d > 0 ? '+' : '';
              return `**${label}** — Poprzedni: \`${prevVal}\` → Bieżący: \`${currVal}\` (${arrow} ${sign}${d})`;
            };

            const quickChartToggleMarker = '<!-- quickchart-toggle -->';
            let useQuickChart = true;
            if (existing && existing.body) {
              const toggleMatch = existing.body.match(/- \[(x| )\] Szybkie wykresy \(QuickChart\)/);
              if (toggleMatch) useQuickChart = toggleMatch[1] === 'x';
            }

            const chartBlock = useQuickChart
              ? `#### Miniwykresy (ostatnie ${history.length} ${history.length === 1 ? 'przebieg' : 'przebiegi'})\n\n| Łączne wykrycia | Liczba plików |\n|---|---|\n| ![hits](${quickChart('Łączne wykrycia', hitsSeries, '#d73a49')}) | ![files](${quickChart('Liczba plików', filesSeries, '#0366d6')}) |\n| \`${sparkline(hitsSeries)}\` ${hitsSeries.join(' → ')} | \`${sparkline(filesSeries)}\` ${filesSeries.join(' → ')} |\n\n<sub>Oś X (od najstarszego do najnowszego): ${labels}</sub>\n\n`
              : `#### Miniwykresy (wyłączone)\n\n_Wykresy QuickChart są obecnie wyłączone. Zaznacz checkbox poniżej, aby je włączyć._\n\n`;

            let trendSection;
            if (!prev) {
              trendSection = `### 📈 Trend wykryć\n\n_Brak poprzedniego przebiegu do porównania — to pierwszy raport na tym PR._\n\n${chartBlock}`;
            } else {
              const hitsDelta = fmtDelta(totalHits, prev.totalHits);
              const filesDelta = fmtDelta(totalFiles, prev.totalFiles);
              const prevFiles = prev.perFile || {};
              const allFiles = Array.from(new Set([...Object.keys(prevFiles), ...Object.keys(currentPerFile)])).sort();
              const rows = allFiles.map(f => {
                const cur = currentPerFile[f] ?? 0;
                const old = prevFiles[f] ?? 0;
                let status = 'bez zmian';
                if (old === 0 && cur > 0) status = '🆕 nowy';
                else if (cur === 0 && old > 0) status = '✅ usunięty';
                else if (cur !== old) status = 'zmiana';
                return `| ${f} | ${old} | ${cur} | ${fmtDelta(cur, old)} | ${status} |`;
              }).join('\n');
              const deltaBlock = useQuickChart
                ? `#### Wykres różnicy (delta)\n\n| Łączne wykrycia | Liczba plików |\n|---|---|\n| ![delta-hits](${deltaBar('Łączne wykrycia', prev.totalHits, totalHits, '#d73a49')}) | ![delta-files](${deltaBar('Liczba plików', prev.totalFiles, totalFiles, '#0366d6')}) |\n\n**Fallback (tekstowy):**\n- ${textDeltaSummary(prev.totalHits, totalHits, 'Łączne wykrycia')}\n- ${textDeltaSummary(prev.totalFiles, totalFiles, 'Liczba plików')}\n\n`
                : `#### Wykres różnicy (wyłączony)\n\n_Wykresy delta QuickChart są obecnie wyłączone. Zaznacz checkbox poniżej, aby je włączyć._\n\n**Tekstowe podsumowanie:**\n- ${textDeltaSummary(prev.totalHits, totalHits, 'Łączne wykrycia')}\n- ${textDeltaSummary(prev.totalFiles, totalFiles, 'Liczba plików')}\n\n`;
              trendSection = `### 📈 Trend wykryć (vs run #${prev.runId})\n\n- **Łącznie wykryć:** ${prev.totalHits} → ${totalHits} (${hitsDelta})\n- **Plików z wykryciami:** ${prev.totalFiles} → ${totalFiles} (${filesDelta})\n\n${chartBlock}${deltaBlock}| Plik | Poprzednio | Teraz | Δ | Status |\n|------|-----------:|------:|---|--------|\n${rows}\n\n`;
            }

            const state = Buffer.from(JSON.stringify({
              runId: context.runId,
              totalHits,
              totalFiles,
              perFile: currentPerFile,
              history,
            })).toString('base64');
            const stateBlock = `<!-- fue-state: ${state} -->`;
            const checkboxState = useQuickChart ? 'x' : ' ';
            const toggleBlock = `${quickChartToggleMarker}\n- [${checkboxState}] Szybkie wykresy (QuickChart)`;


            const body = `${marker}\n${stateBlock}\n${toggleBlock}\n\n## 🔍 FUE Terminology Check — wykryto niedozwolone wystąpienia`\n\n**Podsumowanie:** znaleziono **${totalHits}** ${totalHits === 1 ? 'wystąpienie' : 'wystąpień'} \`FUE\` w **${totalFiles}** ${totalFiles === 1 ? 'pliku' : 'plikach'}. Po migracji na DHI wszystkie odniesienia powinny używać nowej terminologii.${artifactLink}${runLink}\n\n_Ostatnia aktualizacja: ${new Date().toISOString()} (run #${context.runId})._\n\n${trendSection}### Liczba wykryć per plik\n\n| Plik | Wykrycia |\n|------|----------|\n${perFileSummary}\n\n### Szczegóły per plik:\n\n${detailsBlocks}\n> Aby zignorować plik, dopisz go do \`ALLOWLIST\` w \`scripts/check-no-fue.mjs\`.`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Fail on FUE findings
        if: steps.guard.outputs.exitcode != '0'
        run: |
          cat fue-report.json
          exit 1
