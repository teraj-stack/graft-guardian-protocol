name: Check FUE Terminology

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check-no-fue:
    name: Verify no FUE references (post-DHI migration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run FUE guard
        run: node scripts/check-no-fue.mjs
